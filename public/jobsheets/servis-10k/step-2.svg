  <text x="555" y="206" font-size="15" font-weight="700" fill="#1e293b" text-anchor="start"></text>
  <text x="570" y="248" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">OLI</text>
  <rect x="80" y="330" width="290" height="100" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="96" y="356" font-size="15" font-weight="700" fill="#1e293b" text-anchor="start">Amati kondisi oli:</text>
  <circle cx="106" cy="380" r="9" fill="#a16207"/>  <text x="122" y="385" font-size="14" font-weight="500" fill="#1e293b" text-anchor="start">Cokelat gelap = normal</text>
  <circle cx="106" cy="408" r="9" fill="#fef3c7" stroke="#1e293b" stroke-width="1.5"/>  <text x="122" y="413" font-size="14" font-weight="600" fill="#dc2626" text-anchor="start">Seperti susu = coolant masuk!</text>
  <text x="400" y="130" font-size="15" font-weight="600" fill="#1e293b" text-anchor="middle">Tunggu ± 3 menit setelah mesin mati → cabut, lap, masukkan, cabut lagi, baca</text>

  <rect x="0" y="456" width="800" height="44" fill="#eff6ff"/>
  <text x="400" y="484" text-anchor="middle" font-size="16" font-weight="600" fill="#2563eb">Baca level oli pada dipstick dan catat kondisi oli lama</text>
