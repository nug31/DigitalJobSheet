  <text x="72" y="40" font-size="22" font-weight="800" fill="#1e293b">Pemeriksaan Kondisi &amp; Level Oli Mesin Lama</text>
  <text x="784" y="40" text-anchor="end" font-size="13" font-weight="700" fill="#64748b">SERVIS 10.000 KM</text>
  <rect x="120" y="230" width="560" height="26" rx="13" fill="#cbd5e1" stroke="#1e293b" stroke-width="3"/>
  <circle cx="100" cy="243" r="30" fill="#d97706" stroke="#1e293b" stroke-width="3"/>
  <circle cx="100" cy="243" r="12" fill="#f8fafc" stroke="#1e293b" stroke-width="2"/>
  <path d="M500,232 L640,232 L640,254 L500,254 Z" fill="#a16207" opacity="0.85"/>
  <line x1="470" y1="210" x2="470" y2="276" stroke="#dc2626" stroke-width="4"/>
